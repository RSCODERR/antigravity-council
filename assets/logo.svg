<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="58" fill="url(#bg)" />
  <!-- Council seats - 3 circles in a triangle -->
  <circle cx="64" cy="36" r="12" fill="white" opacity="0.95"/>
  <circle cx="40" cy="72" r="12" fill="white" opacity="0.85"/>
  <circle cx="88" cy="72" r="12" fill="white" opacity="0.85"/>
  <!-- Connection lines -->
  <line x1="64" y1="48" x2="40" y2="60" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="64" y1="48" x2="88" y2="60" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="52" y1="72" x2="76" y2="72" stroke="white" stroke-width="2" opacity="0.5"/>
  <!-- Center dot - synthesis -->
  <circle cx="64" cy="58" r="5" fill="#fbbf24" opacity="0.9"/>
  <!-- Model indicators -->
  <text x="64" y="40" text-anchor="middle" font-size="12" font-family="system-ui" fill="#6366f1" font-weight="bold">G</text>
  <text x="40" y="76" text-anchor="middle" font-size="12" font-family="system-ui" fill="#6366f1" font-weight="bold">C</text>
  <text x="88" y="76" text-anchor="middle" font-size="12" font-family="system-ui" fill="#6366f1" font-weight="bold">O</text>
  <!-- Label -->
  <text x="64" y="104" text-anchor="middle" font-size="11" font-family="system-ui" fill="white" font-weight="600" letter-spacing="0.5">COUNCIL</text>
</svg>
